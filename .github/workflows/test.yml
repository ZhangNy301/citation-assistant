name: Skill regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y curl jq sqlite3
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew list jq >/dev/null 2>&1 || brew install jq
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v
